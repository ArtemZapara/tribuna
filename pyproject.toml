[project]
name = "tribuna"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "RUF",
    "FURB",
    "YTT",
    "C",
    "DTZ",
    "PYI",
    "PT",
    "TRY",
    "PERF",
    "SIM",
    "RET",
    "ASYNC",
    "PIE",
    "PL",
]
ignore = [
    "E501",
    "COM819",
]

[tool.ruff.lint.isort]
known-first-party = ["tribuna"]
lines-between-types = 1
