[project]
name = "tribuna"
version = "0.1.0"
description = "Football analysis demonstration and research workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/backend"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.18.0",
    "pyarrow>=18.0.0",
    "pytest>=8.3.0",
    "ruff>=0.16.4",
    "yt-dlp[default]",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "RUF",
    "FURB",
    "YTT",
    "C",
    "DTZ",
    "PYI",
    "PT",
    "TRY",
    "PERF",
    "SIM",
    "RET",
    "ASYNC",
    "PIE",
    "PL",
]
ignore = [
    "E501",
    "COM819",
]

[tool.ruff.lint.isort]
known-first-party = ["tribuna"]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["TRY003"]
"tests/**/*.py" = ["PLR2004", "TRY003"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/backend/src"]
testpaths = ["tests", "apps/backend/tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["apps/backend/src"]
plugins = ["pydantic.mypy"]
