[project]
name = "tribuna-backend"
version = "0.1.0"
description = "Tribuna HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic-settings>=2.10.0",
    "structlog>=25.4.0",
    "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tribuna"]
